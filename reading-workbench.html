<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阅读工作台</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2b2a;--mute:#6b7a78;--line:#d9e0dd;--acc:#1f6f6b;--hl:#e4eda8;--on:#1f6f6b;--dg:#b3402f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1c2423;--ink:#e3eae8;--mute:#8fa09d;--line:#2d3836;--acc:#5cc0b9;--hl:#46502a;--on:#5cc0b9;--dg:#e8806f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:0 0 210px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header button{padding:6px 8px;white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:disabled{opacity:.5}
main{max-width:760px;margin:0 auto;padding:14px}
section{margin-bottom:22px}
textarea,input[type=text],input[type=password],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#paste{height:180px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;color:var(--mute);font-size:13px}
.bar label{display:flex;gap:4px;align-items:center}
#reader .p{position:relative;padding:6px 0 6px 12px;border-left:3px solid transparent;font-family:"Noto Serif SC","Songti SC",Georgia,serif;font-size:16.5px;line-height:1.75}
#reader .p.q{border-left-color:var(--acc)}
#reader .zh{color:var(--mute);font-family:system-ui,"PingFang SC",sans-serif;font-size:14.5px;margin-top:2px;display:none}
#reader.showzh .zh{display:block}
.p .tr{position:absolute;right:0;top:4px;font-size:12px;padding:1px 6px;opacity:.55}
.p .en,.p .zh{padding-right:34px}
::selection{background:var(--hl);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.card{scroll-margin-top:150px}
.card.on{border-left-color:var(--on)}
.qh{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.qh .sp{flex:1}
.quote{border-left:2px solid var(--line);padding-left:8px;margin:4px 0;color:var(--mute);font-size:13.5px;white-space:pre-wrap}
.quote b{color:var(--acc);font-weight:600}
.qq{font-weight:600;margin:6px 0 4px;white-space:pre-wrap}
.aa{white-space:pre-wrap;word-break:break-word}
code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:.92em}
#qbar{position:sticky;top:50px;z-index:4;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);margin:0 0 10px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:760px;margin:0 auto}
#chips{display:flex;flex-direction:column;gap:4px;max-height:84px;overflow:auto;margin-bottom:6px}
.chip{display:flex;gap:6px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px}
.chip span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ask{height:56px;resize:none}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}
.row .sp{flex:1}
#fab{position:fixed;right:14px;bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:6;display:none;box-shadow:0 2px 10px #0004}
#fabBack{position:fixed;left:14px;bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:6;display:none;box-shadow:0 2px 10px #0004}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:20;display:none;max-width:88vw;font-size:13px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:min(480px,92vw);padding:16px}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
.row select{flex:1;min-width:0;width:auto}
#bSet{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.cf{display:flex;align-items:center;gap:8px;margin-top:10px}.cf .sp{flex:1}
.cf label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute)}.cf input{width:18px;height:18px}
button.del{color:var(--dg);border-color:var(--dg);background:transparent;font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0 2px}.tabs button.act{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#qlist{max-height:58vh;overflow:auto;margin-top:8px}
.qi{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.qi input{width:20px;height:20px;margin-top:2px;flex:none}
.qt{flex:1;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer}
.qi.on .qt b{color:var(--acc)}.qi:not(.on) .qt{color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>阅读工作台</h1>
  <button id="bNew">新文章</button>
  <button id="bImp">导入</button><button id="bExp">导出</button><input type="file" id="impFile" accept=".json,application/json" hidden>
  <button id="bSet">⚙</button>
</header>
<main>
  <section id="secPaste">
    <textarea id="paste" placeholder="把文章粘贴到这里，按空行分段"></textarea>
    <div class="bar"><button class="pri" id="bLoad">载入文章</button></div>
  </section>
  <section id="secRead" hidden>
    <div class="bar">
      <label><input type="checkbox" id="showZh"> 显示译文</label>
      <button id="bTrAll">翻译全文</button>
      <span id="trState"></span>
    </div>
    <div id="reader"></div>
  </section>
  <section id="secQA" hidden>
    <div id="qbar">
      <div class="bar" style="margin:0">
        <label><input type="checkbox" id="useArt"> 带全文</label>
        <span id="qinfo"></span>
        </div><div class="bar" style="margin:4px 0 0">
        <button id="bAll">全开</button><button id="bNone">全关</button><button id="bLast">最近3组</button><button id="bQ">队列</button>
      </div>
    </div>
    <div id="cards"></div>
  </section>
</main>
<button id="fab" class="pri">引用选中</button>
<button id="fabBack" class="pri">↩ 回到阅读位置</button>
<footer><div class="in">
  <div id="chips"></div>
  <textarea id="ask" placeholder="针对引用的段落提问；没有引用也可以直接问"></textarea>
  <div class="row">
    <label>引用版本</label>
    <label><input type="checkbox" id="cEn" checked> 英文</label>
    <label><input type="checkbox" id="cZh" checked> 中文</label>
    <span class="sp"></span>
    <button class="pri" id="bSend">发送</button>
  </div>
</div></footer>
<div id="toast"></div>
<dialog id="dq"><div class="row" style="margin-top:0"><b>发送队列</b><span id="dqInfo" style="color:var(--mute);font-size:13px"></span><span class="sp"></span><button id="dqAll"></button><button id="dqClose">关闭</button></div><div id="qlist"></div></dialog>

<dialog id="dlg">
  <b>设置</b><div class="tabs"><button id="tabApi" class="act">API 设置</button><button id="tabPref">偏好设置</button></div><div id="paneApi">
  <label>服务商</label>
  <div class="row" style="margin-top:0"><select id="fProv"></select><button id="fAdd">新增</button><button id="fDel">删除</button></div>
  <label>名称</label>
  <input type="text" id="fName">
  <label>接口格式</label>
  <select id="fFmt"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select>
  <label>接口地址（OpenAI 兼容一般以 /v1 结尾）</label>
  <input type="text" id="fBase">
  <label>API Key（只存在本机浏览器）</label>
  <input type="password" id="fKey">
  <label>模型</label>
  <div class="row" style="margin-top:0"><select id="fModel"></select><button id="fGet">获取模型</button></div>
  <label>翻译所用服务商</label>
  <select id="tProv"></select>
  <label>翻译所用模型</label>
  <select id="tModel"></select>
  <label>问答系统提示（所有服务商共用）</label>
  <textarea id="fSys" style="height:80px"></textarea>
  <label>翻译提示词</label>
  <textarea id="fTr" style="height:64px"></textarea>
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="fAuto"> 新回答默认放入队列</label>
  </div>
  <div id="panePref" hidden>
    <label style="display:flex;gap:6px;align-items:center;margin-top:12px"><input type="checkbox" id="pZh"> 打开时默认显示译文</label>
    <label>引用选项默认勾选</label>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pEn"> 英文</label>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pQZh"> 中文</label>
  </div>
  <div class="row"><span class="sp"></span><button id="fCancel">取消</button><button class="pri" id="fSave">保存</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
const DEF={autoOn:false,showZh:false,qEn:true,qZh:true,trSys:'把用户给出的英文翻译成流畅、准确的中文，只输出译文。',sys:'你是阅读助手。用户在阅读一篇文章，会引用其中的片段提问。请结合全文与引用内容，用中文清晰、准确地回答。'};
const PDEF={name:'默认',fmt:'openai',base:'https://api.openai.com/v1',key:'',model:'',models:[]};
let S={cfg:{...DEF},providers:[],cur:0,tr:{prov:0,model:''},paras:[],groups:[],useArt:true};
try{const d=JSON.parse(localStorage.getItem('rw1')||'{}');S={...S,...d,cfg:{...DEF,...(d.cfg||{})}}}catch(e){}
if(!S.providers.length){const c=S.cfg;S.providers=[{...PDEF,id:Date.now(),fmt:c.fmt||PDEF.fmt,base:c.base||PDEF.base,key:c.key||'',model:c.model||''}];S.cur=S.providers[0].id}
const save=()=>{try{localStorage.setItem('rw1',JSON.stringify(S))}catch(e){}};
let quotes=[],busy=false,pending=null,tt,back=null,jumpAt=0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}

/* ---------- API ---------- */
async function llm(system,msgs,tr){
  const c=tr?trCfg():cur();if(!c.key||!c.model)throw Error('请先在 ⚙ 里填写 API Key 和模型名');
  const base=c.base.replace(/\/+$/,'');let url,h={'Content-Type':'application/json'},b;
  if(c.fmt==='anthropic'){url=base+'/v1/messages';h['x-api-key']=c.key;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true';b={model:c.model,max_tokens:4096,system,messages:msgs}}
  else{url=base+'/chat/completions';h.Authorization='Bearer '+c.key;b={model:c.model,messages:[{role:'system',content:system},...msgs]}}
  let r;try{r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(b)})}catch(e){throw Error('网络请求失败，可能是接口不允许浏览器直连（CORS）')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error((j.error&&(j.error.message||j.error))||('HTTP '+r.status));
  return c.fmt==='anthropic'?j.content.map(x=>x.text||'').join(''):j.choices[0].message.content;
}
const trText=t=>llm(S.cfg.trSys||DEF.trSys,[{role:'user',content:t}],true);

/* ---------- reader ---------- */
const paraHtml=i=>{const p=S.paras[i];
  return `<div class="p" data-i="${i}"><div class="en" data-l="en">${esc(p.en)}</div>${p.zh?`<div class="zh" data-l="zh">${esc(p.zh)}</div>`:''}<button class="tr" data-tr="${i}">${p.zh?'重译':'译'}</button></div>`};
function renderReader(){
  $('#reader').innerHTML=S.paras.map((_,i)=>paraHtml(i)).join('');
  markQuoted();
  const has=S.paras.length>0;
  if(!has){back=null;$('#fabBack').style.display='none'}
  $('#secPaste').hidden=has;$('#secRead').hidden=!has;$('#secQA').hidden=!has;
}
function markQuoted(){
  const used=new Set(S.groups.flatMap(g=>g.quotes.map(q=>q.i)));
  quotes.forEach(q=>used.add(q.i));
  document.querySelectorAll('#reader .p').forEach(el=>el.classList.toggle('q',used.has(+el.dataset.i)));
}
function loadArticle(){
  const t=$('#paste').value.trim();if(!t)return toast('先粘贴文章');
  let ps=t.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(ps.length<2)ps=t.split(/\n/).map(s=>s.trim()).filter(Boolean);
  S.paras=ps.map(en=>({en,zh:''}));S.groups=[];quotes=[];save();renderReader();renderAll();
}
async function trOne(i){
  const zh=await trText(S.paras[i].en);S.paras[i].zh=zh;save();
  const el=document.querySelector(`#reader .p[data-i="${i}"]`);if(el)el.outerHTML=paraHtml(i);markQuoted();
}
async function trAll(){
  const idx=S.paras.map((_,i)=>i).filter(i=>!S.paras[i].zh);if(!idx.length)return toast('已全部翻译');
  $('#showZh').checked=true;$('#reader').classList.add('showzh');
  let k=0,done=0,stop=false;$('#bTrAll').disabled=true;
  const upd=()=>$('#trState').textContent=`${done}/${idx.length}`;upd();
  await Promise.all([0,1,2].map(async()=>{while(k<idx.length&&!stop){const i=idx[k++];
    try{await trOne(i);done++;upd()}catch(e){stop=true;toast(e.message)}}}));
  $('#bTrAll').disabled=false;
}

/* ---------- selection → quote ---------- */
document.addEventListener('selectionchange',()=>{
  const s=getSelection();let ok=false;
  if(s&&!s.isCollapsed&&s.anchorNode){
    const n=s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement;
    const el=n&&n.closest&&n.closest('#reader .en,#reader .zh');
    const text=s.toString().trim();
    if(el&&text){pending={text,l:el.dataset.l,i:+el.closest('.p').dataset.i};ok=true}
  }
  if(ok)$('#fab').style.display='block';
  else if(!$('#fab').matches(':active'))$('#fab').style.display='none';
});
$('#fab').addEventListener('pointerdown',e=>e.preventDefault());
$('#fab').addEventListener('click',()=>{
  if(!pending)return;
  let useEn=$('#cEn').checked,useZh=$('#cZh').checked;
  if(!useEn&&!useZh){if(pending.l==='en')useEn=true;else useZh=true}
  const q={i:pending.i,en:'',zh:'',busy:false};
  if(pending.l==='en'){
    if(useEn)q.en=pending.text;
    if(useZh){q.busy=true;trText(pending.text).then(z=>{q.zh=z}).catch(e=>toast(e.message)).finally(()=>{q.busy=false;renderChips()})}
  }else{
    if(useZh)q.zh=pending.text;
    if(useEn)q.en=S.paras[pending.i].en; /* 在译文中选取时，英文取整段原文 */
  }
  quotes.push(q);pending=null;getSelection().removeAllRanges();$('#fab').style.display='none';renderChips();markQuoted();
});
function renderChips(){
  $('#chips').innerHTML=quotes.map((q,k)=>`<div class="chip"><span>第${q.i+1}段｜${esc((q.en||'')+(q.en&&q.zh?' ／ ':'')+(q.busy?'（译文生成中…）':q.zh||''))}</span><button data-rq="${k}">✕</button></div>`).join('');
}

/* ---------- groups ---------- */
const fmtQuote=q=>`【引用·第${q.i+1}段】`+(q.en?`\nEN: ${q.en}`:'')+(q.zh?`\nZH: ${q.zh}`:'');
const fmtGroup=g=>(g.quotes.length?g.quotes.map(fmtQuote).join('\n\n')+'\n\n':'')+'问题：'+g.q;
const sysPrompt=()=>S.cfg.sys+(S.useArt&&S.paras.length?'\n\n【文章全文】\n'+S.paras.map(p=>p.en).join('\n\n'):'');
function queueMsgs(){const m=[];S.groups.filter(g=>g.on&&g.a).forEach(g=>m.push({role:'user',content:fmtGroup(g)},{role:'assistant',content:g.a}));return m}
function renderCards(){
  $('#cards').innerHTML=S.groups.length?S.groups.map((g,n)=>`<div class="card ${g.on?'on':''}" data-id="${g.id}">
    <div class="qh"><b>第${n+1}组</b><span class="sp"></span><button data-cp>复制</button></div>
    ${g.quotes.map(q=>`<div class="quote"><b>第${q.i+1}段</b>\n${esc([q.en&&'EN: '+q.en,q.zh&&'ZH: '+q.zh].filter(Boolean).join('\n'))}</div>`).join('')}
    <div class="qq">${esc(g.q)}</div><div class="aa">${md(g.a)}</div><div class="cf"><button class="del" data-del>删除卡片</button><span class="sp"></span><label><input type="checkbox" data-on ${g.on?'checked':''}> 入队</label></div></div>`).join(''):'<div class="empty">选中文章里的一段，点「引用选中」，再提问</div>';
}
function renderInfo(){
  const on=S.groups.filter(g=>g.on).length;
  const chars=sysPrompt().length+queueMsgs().reduce((a,m)=>a+m.content.length,0);
  $('#qinfo').textContent=`已入队 ${on}/${S.groups.length} 组 · 约 ${Math.ceil(chars/2.5)} tokens`;
  $('#useArt').checked=S.useArt;
}
function renderAll(){renderCards();renderQueue();renderInfo();renderChips();markQuoted()}

async function send(){
  const q=$('#ask').value.trim();if(!q||busy)return;
  if(quotes.some(x=>x.busy))return toast('译文还在生成，稍等');
  const g={id:Date.now(),quotes:[...quotes],q,a:'',on:S.cfg.autoOn};
  const msgs=[...queueMsgs(),{role:'user',content:fmtGroup(g)}];
  busy=true;$('#bSend').disabled=true;$('#bSend').textContent='思考中…';
  try{
    g.a=await llm(sysPrompt(),msgs);
    savePos();S.groups.push(g);quotes=[];$('#ask').value='';save();renderAll();jumpTo(g.id);
  }catch(e){toast(e.message)}
  busy=false;$('#bSend').disabled=false;$('#bSend').textContent='发送';
}

/* ---------- jump / back ---------- */
function savePos(){
  const h=document.querySelector('header').offsetHeight;
  if($('#secRead').getBoundingClientRect().bottom<=h)return; /* 已经在卡片区，保留之前记录的位置 */
  const el=[...document.querySelectorAll('#reader .p')].find(e=>e.getBoundingClientRect().bottom>h+4);
  back=el?{i:+el.dataset.i,off:el.getBoundingClientRect().top}:{y:scrollY};
}
function jumpTo(id){
  const el=document.querySelector(`.card[data-id="${id}"]`);
  jumpAt=Date.now();if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  if(back)$('#fabBack').style.display='block';
}
$('#fabBack').onclick=()=>{
  if(back){
    if(back.i!==undefined){const el=document.querySelector(`#reader .p[data-i="${back.i}"]`);if(el)scrollTo({top:scrollY+el.getBoundingClientRect().top-back.off,behavior:'smooth'})}
    else scrollTo({top:back.y,behavior:'smooth'});
  }
  back=null;$('#fabBack').style.display='none';
};
addEventListener('scroll',()=>{
  if(back&&Date.now()-jumpAt>2000&&$('#secRead').getBoundingClientRect().bottom>innerHeight*0.6){back=null;$('#fabBack').style.display='none'}
},{passive:true});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.tr!==undefined){const b=t;b.disabled=true;trOne(+t.dataset.tr).catch(x=>{toast(x.message);b.disabled=false});$('#showZh').checked=true;$('#reader').classList.add('showzh')}
  if(t.dataset.rq!==undefined){quotes.splice(+t.dataset.rq,1);renderChips();markQuoted()}
  const card=t.closest&&t.closest('.card');
  if(card){const g=S.groups.find(x=>x.id==card.dataset.id);
    if(t.dataset.del!==undefined&&confirm('删除这一组？')){S.groups=S.groups.filter(x=>x!==g);save();renderAll()}
    if(t.dataset.cp!==undefined)navigator.clipboard&&navigator.clipboard.writeText(g.q+'\n\n'+g.a).then(()=>toast('已复制'))}
});
document.addEventListener('change',e=>{
  const card=e.target.closest&&e.target.closest('.card');
  if(card&&e.target.dataset.on!==undefined){S.groups.find(x=>x.id==card.dataset.id).on=e.target.checked;save();renderAll()}
});
$('#useArt').onchange=e=>{S.useArt=e.target.checked;save();renderInfo()};
$('#showZh').onchange=e=>$('#reader').classList.toggle('showzh',e.target.checked);
$('#bAll').onclick=()=>{S.groups.forEach(g=>g.on=true);save();renderAll()};
$('#bNone').onclick=()=>{S.groups.forEach(g=>g.on=false);save();renderAll()};
$('#bLast').onclick=()=>{S.groups.forEach((g,i)=>g.on=i>=S.groups.length-3);save();renderAll()};
$('#bLoad').onclick=loadArticle;
$('#bNew').onclick=()=>{if(!S.paras.length||confirm('清空当前文章和所有问答？建议先导出。')){S.paras=[];S.groups=[];quotes=[];$('#paste').value='';save();renderReader();renderAll()}};
$('#bTrAll').onclick=trAll;
$('#bSend').onclick=send;
$('#ask').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))send()});
$('#bExp').onclick=()=>{
  if(!S.paras.length)return toast('还没有内容可导出');
  const def='reading-'+new Date().toISOString().slice(0,10);
  let n=prompt('导出文件名（不用加 .json）',def);if(n===null)return;
  n=n.trim().replace(/\.json$/i,'').replace(/[\\/:*?"<>|]/g,'_')||def;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({paras:S.paras,groups:S.groups},null,1)],{type:'application/json'}));
  a.download=n+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
$('#bImp').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.paras)||!d.paras.length)throw Error('文件格式不对：找不到文章段落');
    if(S.paras.length&&!confirm('导入会替换当前文章和所有问答（建议先导出）。继续？'))return;
    S.paras=d.paras.map(p=>({en:String(p.en||''),zh:String(p.zh||'')}));
    S.groups=(Array.isArray(d.groups)?d.groups:[]).map((g,k)=>({id:g.id||Date.now()+k,quotes:(g.quotes||[]).map(q=>({i:+q.i||0,en:q.en||'',zh:q.zh||'',busy:false})),q:String(g.q||''),a:String(g.a||''),on:!!g.on}));
    quotes=[];back=null;$('#fabBack').style.display='none';save();renderReader();renderAll();toast(`已导入：${S.paras.length} 段，${S.groups.length} 组问答`);
  }catch(err){toast(err.message.startsWith('文件')?err.message:'导入失败：'+err.message)}
};
/* queue panel */
const firstSent=a=>{const t=String(a).replace(/[*`#>]/g,'').split('\n').map(x=>x.trim()).find(Boolean)||'';const m=t.match(/^.*?[。！？!?]|^.*?\.(?=\s|$)/);return (m?m[0]:t).slice(0,120)};
function renderQueue(){
  const L=$('#qlist'),st=L.scrollTop,all=S.groups.length&&S.groups.every(g=>g.on);
  $('#dqInfo').textContent=`已入队 ${S.groups.filter(g=>g.on).length}/${S.groups.length}`;
  $('#dqAll').textContent=all?'取消全选':'全选';$('#dqAll').disabled=!S.groups.length;
  L.innerHTML=S.groups.length?S.groups.map((g,n)=>`<div class="qi ${g.on?'on':''}" data-id="${g.id}"><input type="checkbox" data-qon ${g.on?'checked':''}><div class="qt" data-go><b>第${n+1}组</b> ${esc(firstSent(g.a)||g.q)}</div></div>`).join(''):'<div class="empty">还没有问答</div>';
  L.scrollTop=st;
}
$('#bQ').onclick=()=>{renderQueue();$('#dq').showModal()};
$('#dqClose').onclick=()=>$('#dq').close();
$('#dqAll').onclick=()=>{const v=!(S.groups.length&&S.groups.every(g=>g.on));S.groups.forEach(g=>g.on=v);save();renderAll()};
document.addEventListener('change',e=>{if(e.target.dataset.qon===undefined)return;const g=S.groups.find(x=>x.id==e.target.closest('.qi').dataset.id);g.on=e.target.checked;save();renderAll()});
document.addEventListener('click',e=>{const go=e.target.closest&&e.target.closest('[data-go]');if(!go)return;const id=go.closest('.qi').dataset.id;$('#dq').close();savePos();jumpTo(id)});
function setTab(t){$('#paneApi').hidden=t!=='api';$('#panePref').hidden=t!=='pref';$('#tabApi').classList.toggle('act',t==='api');$('#tabPref').classList.toggle('act',t==='pref')}
$('#tabApi').onclick=()=>setTab('api');$('#tabPref').onclick=()=>setTab('pref');
/* settings */
const cur=()=>S.providers.find(p=>p.id===S.cur)||S.providers[0];
let D,dCur,DT={prov:0,model:''};
function trCfg(){const p=S.providers.find(x=>x.id===S.tr.prov)||cur();return {...p,model:S.tr.model||p.model}}
function fillT(){
  if(DT.prov&&!D.some(x=>x.id===DT.prov))DT.prov=0;
  $('#tProv').innerHTML='<option value="0">跟随当前服务商</option>'+D.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#tProv').value=DT.prov;
  const p=D.find(x=>x.id===DT.prov)||dc();const l=[...p.models];if(DT.model&&!l.includes(DT.model))l.unshift(DT.model);
  $('#tModel').innerHTML='<option value="">跟随该服务商所选模型</option>'+l.map(m=>`<option>${esc(m)}</option>`).join('')+'<option value="__m">手动输入…</option>';$('#tModel').value=DT.model}
$('#tProv').onchange=e=>{DT.prov=+e.target.value;DT.model='';fillT()};
$('#tModel').onchange=e=>{if(e.target.value==='__m'){const m=(prompt('输入模型名')||'').trim();if(m)DT.model=m}else DT.model=e.target.value;fillT()};
const dc=()=>D.find(p=>p.id===dCur);
const renderSet=()=>{$('#bSet').textContent='⚙ '+cur().name};
function readF(){const p=dc();p.name=$('#fName').value.trim()||'未命名';p.fmt=$('#fFmt').value;p.base=$('#fBase').value.trim();p.key=$('#fKey').value.trim()}
function fillModels(){const p=dc();const l=[...p.models];if(p.model&&!l.includes(p.model))l.unshift(p.model);
  $('#fModel').innerHTML='<option value="">（未选择）</option>'+l.map(m=>`<option>${esc(m)}</option>`).join('')+'<option value="__m">手动输入…</option>';$('#fModel').value=p.model}
function fillF(){const p=dc();$('#fProv').innerHTML=D.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#fProv').value=dCur;
  $('#fName').value=p.name;$('#fFmt').value=p.fmt;$('#fBase').value=p.base;$('#fKey').value=p.key;fillModels();fillT()}
async function fetchModels(p){
  if(!p.key)throw Error('先填写 API Key');
  const base=p.base.replace(/\/+$/,'');let url,h;
  if(p.fmt==='anthropic'){url=base+'/v1/models?limit=1000';h={'x-api-key':p.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}}
  else{url=base+'/models';h={Authorization:'Bearer '+p.key}}
  let r;try{r=await fetch(url,{headers:h})}catch(e){throw Error('网络请求失败，可能是地址不对或接口不允许浏览器直连（CORS）')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error((j.error&&(j.error.message||j.error))||('HTTP '+r.status));
  return [...new Set((j.data||j.models||[]).map(m=>typeof m==='string'?m:(m.id||m.name)).filter(Boolean))].sort();
}
$('#bSet').onclick=()=>{D=JSON.parse(JSON.stringify(S.providers));dCur=cur().id;DT={...S.tr};fillF();$('#fSys').value=S.cfg.sys;$('#fTr').value=S.cfg.trSys;$('#fAuto').checked=S.cfg.autoOn;$('#pZh').checked=S.cfg.showZh;$('#pEn').checked=S.cfg.qEn;$('#pQZh').checked=S.cfg.qZh;setTab('api');$('#dlg').showModal()};
$('#fProv').onchange=e=>{readF();dCur=+e.target.value;fillF()};
$('#fAdd').onclick=()=>{readF();const p={...PDEF,models:[],id:Date.now(),name:'服务商'+(D.length+1)};D.push(p);dCur=p.id;fillF()};
$('#fDel').onclick=()=>{if(D.length<2)return toast('至少保留一个服务商');if(!confirm('删除「'+dc().name+'」？'))return;D=D.filter(x=>x.id!==dCur);dCur=D[0].id;fillF()};
$('#fFmt').onchange=e=>{const b=$('#fBase');if(e.target.value==='anthropic'&&b.value===PDEF.base)b.value='https://api.anthropic.com';if(e.target.value==='openai'&&b.value==='https://api.anthropic.com')b.value=PDEF.base};
$('#fModel').onchange=e=>{const p=dc();
  if(e.target.value==='__m'){const m=(prompt('输入模型名')||'').trim();if(m)p.model=m}else p.model=e.target.value;fillModels()};
$('#fGet').onclick=async()=>{readF();const p=dc(),b=$('#fGet');b.disabled=true;b.textContent='获取中…';
  try{p.models=await fetchModels(p);fillModels();fillT();toast('获取到 '+p.models.length+' 个模型')}catch(e){toast(e.message)}
  b.disabled=false;b.textContent='获取模型'};
$('#fCancel').onclick=()=>$('#dlg').close();
$('#fSave').onclick=()=>{readF();S.providers=D;S.cur=dCur;S.tr=DT;S.cfg.sys=$('#fSys').value.trim()||DEF.sys;S.cfg.trSys=$('#fTr').value.trim()||DEF.trSys;S.cfg.autoOn=$('#fAuto').checked;S.cfg.showZh=$('#pZh').checked;S.cfg.qEn=$('#pEn').checked;S.cfg.qZh=$('#pQZh').checked;save();$('#dlg').close();renderSet();toast('已保存')};

renderSet();
renderReader();renderAll();
$('#showZh').checked=S.cfg.showZh;$('#reader').classList.toggle('showzh',S.cfg.showZh);$('#cEn').checked=S.cfg.qEn;$('#cZh').checked=S.cfg.qZh;
</script>
</body>
</html>
