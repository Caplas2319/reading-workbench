<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阅读工作台</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2b2a;--mute:#6b7a78;--line:#d9e0dd;--acc:#1f6f6b;--hl:#e4eda8;--on:#1f6f6b;--dg:#b3402f;--star:#d9a400;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1c2423;--ink:#e3eae8;--mute:#8fa09d;--line:#2d3836;--acc:#5cc0b9;--hl:#46502a;--on:#5cc0b9;--dg:#e8806f;--star:#f0c040;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:0 0 210px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header button{padding:6px 8px;white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:disabled{opacity:.5}
main{max-width:760px;margin:0 auto;padding:14px}
section{margin-bottom:22px}
textarea,input[type=text],input[type=password],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#paste{height:min(62vh,480px);resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;color:var(--mute);font-size:13px}
.bar label{display:flex;gap:4px;align-items:center}
#reader .p{position:relative;min-height:58px;padding:6px 0 6px 12px;border-left:3px solid transparent;font-family:"Noto Serif SC","Songti SC",Georgia,serif;font-size:var(--fs,16.5px);line-height:1.75}
#reader .p.q{border-left-color:var(--acc)}
#reader .zh{color:var(--mute);font-family:system-ui,"PingFang SC",sans-serif;font-size:calc(var(--fs,16.5px)*.88);margin-top:2px;display:none}
#reader.showzh .zh{display:block}
.p .tr{position:absolute;right:0;top:30px;font-size:12px;padding:1px 6px;opacity:.55}
.p .en,.p .zh{padding-right:44px}
.p .st{position:absolute;right:0;top:0;font-size:18px;line-height:1.3;padding:2px 6px;border:none;background:transparent;color:var(--mute);opacity:.7}
.p.bm .st{color:var(--star);opacity:1}
::selection{background:var(--hl);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.card{scroll-margin-top:150px}
.card.on{border-left-color:var(--on)}
.qh{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.qh .sp{flex:1}
.quote{border-left:2px solid var(--line);padding-left:8px;margin:4px 0;color:var(--mute);font-size:13.5px;white-space:pre-wrap}
.quote b{color:var(--acc);font-weight:600}
.qq{font-weight:600;margin:6px 0 4px;white-space:pre-wrap}
.aa{white-space:pre-wrap;word-break:break-word}
.tw{overflow-x:auto;margin:6px 0}.tw table{border-collapse:collapse;font-size:13.5px;white-space:normal}.tw th,.tw td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;min-width:4.5em}.tw th{background:var(--bg)}
code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:.92em}
#qbar{position:sticky;top:50px;z-index:4;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);margin:0 0 10px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:760px;margin:0 auto}
#chips{display:flex;flex-direction:column;gap:4px;max-height:84px;overflow:auto;margin-bottom:6px}
.chip{display:flex;gap:6px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px}
.chip span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ask{height:56px;resize:none}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}
.row .sp{flex:1}
#fab{position:fixed;right:14px;bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:6;display:none;box-shadow:0 2px 10px #0004}
#fabBack{position:fixed;left:14px;bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:6;display:none;box-shadow:0 2px 10px #0004}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:20;display:none;max-width:88vw;font-size:13px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:min(480px,92vw);padding:16px}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
.row select{flex:1;min-width:0;width:auto}
#bSet{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.cf{display:flex;align-items:center;gap:8px;margin-top:10px}.cf .sp{flex:1}
.cf label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute)}.cf input{width:18px;height:18px}
button.del{color:var(--dg);border-color:var(--dg);background:transparent;font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0 2px}.tabs button.act{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#qlist{max-height:58vh;overflow:auto;margin-top:8px}
.qi{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.qi input{width:20px;height:20px;margin-top:2px;flex:none}
.qt{flex:1;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer}
.qi.on .qt b{color:var(--acc)}.qi:not(.on) .qt{color:var(--mute)}
.hd{flex:none;width:30px;text-align:center;color:var(--mute);font-size:20px;line-height:22px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.qi.drag{opacity:.6;background:var(--bg)}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li input{width:20px;height:20px;flex:none}
.lt{flex:1;min-width:0;cursor:pointer}.lt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12.5px;color:var(--mute)}
#hT{cursor:default}
[hidden]{display:none!important}
dialog,#qlist{overscroll-behavior:contain}
body.nf{padding-bottom:0}
.tk{font-size:11.5px;color:var(--mute);flex:none;min-width:34px;text-align:right;margin-top:2px}
#bSave.ok{border-color:var(--acc);color:var(--acc)}
#bSave.warn{border-color:var(--dg);color:var(--dg)}
</style>
</head>
<body>
<header>
  <button id="bBack" hidden>‹ 返回</button>
  <h1 id="hT">阅读工作台</h1>
  <button id="bSum" hidden>摘要</button><button id="bSet">⚙</button>
</header>
<main>
<div id="vShelf">
  <div class="bar"><button class="pri" id="bNewBook">新建文件夹</button><button id="bImp">导入</button><button id="bEpub">导入 EPUB</button><input type="file" id="epubFile" accept=".epub,application/epub+zip" hidden><input type="file" id="impFile" accept=".json,application/json" hidden></div>
  <div id="shelf"></div>
</div>
<div id="vBook" hidden>
  <div class="bar"><button class="pri" id="bNewCh">新文章</button><button id="bExp">导出本书</button></div>
  <div class="bar"><button id="bSelAll">全选</button><button id="bMove">移动所选</button><button class="del" id="bDelSel">删除所选</button><span id="selInfo"></span></div>
  <div id="chlist"></div>
</div>
<div id="vRead" hidden>
  <section id="secPaste">
    <textarea id="paste" placeholder="把文章粘贴到这里，按空行分段"></textarea>
    <div class="bar"><button class="pri" id="bLoad">载入文章</button></div>
  </section>
  <section id="secRead" hidden>
    <div class="bar">
      <label><input type="checkbox" id="showZh"> 显示译文</label>
      <button id="bTrAll">翻译全文</button><button id="bMerge">智能合并</button><button id="bSplitLen">按字数拆</button><button id="bSplitSent">按句拆</button><button id="bEdit">编辑全文</button>
      <span id="trState"></span>
    </div>
    <div id="reader"></div>
  </section>
  <section id="secQA" hidden>
    <div id="cards"></div>
  </section>
</div></main>
<button id="fab" class="pri">引用选中</button>
<button id="fabBack" class="pri">↩ 回到阅读位置</button>
<footer><div class="in">
  <div id="chips"></div>
  <textarea id="ask" placeholder="针对引用的段落提问；没有引用也可以直接问"></textarea>
  <div class="row">
    <span class="sp"></span>
    <button id="bSave">保存</button><button id="bMark">书签</button><button id="bJump" disabled>跳转</button><button id="bQ">队列</button><button class="pri" id="bSend">发送</button>
  </div>
</div></footer>
<div id="toast"></div>
<dialog id="dq"><div class="row" style="margin-top:0"><b>提示词队列</b><span id="dqInfo" style="color:var(--mute);font-size:13px"></span><span class="sp"></span><button id="dqAll"></button><button id="dqClose">关闭</button></div><div id="qlist"></div></dialog>
<dialog id="dsum"><div class="row" style="margin-top:0"><b id="dsT">摘要</b><span class="sp"></span><button id="dsGen">生成</button><button class="pri" id="dsDone">完成</button></div>
<textarea id="dsText" style="height:240px;margin-top:8px" placeholder="点「生成」，或直接手写、修改；关闭时自动保存"></textarea></dialog>

<dialog id="dmv"><b>移动到文件夹</b><select id="mvTo" style="margin-top:10px"></select><div class="row"><span class="sp"></span><button id="mvCancel">取消</button><button class="pri" id="mvOk">移动</button></div></dialog>
<dialog id="ded"><div class="row" style="margin-top:0"><b>编辑全文</b><span class="meta">空行 = 分段</span><span class="sp"></span><button id="edCancel">取消</button><button class="pri" id="edSave">保存</button></div>
<textarea id="edText" style="height:min(60vh,420px);margin-top:8px"></textarea></dialog>

<dialog id="dlg">
  <b>设置</b><div class="tabs"><button id="tabApi" class="act">API 设置</button><button id="tabPref">偏好设置</button></div><div id="paneApi">
  <label>服务商</label>
  <div class="row" style="margin-top:0"><select id="fProv"></select><button id="fAdd">新增</button><button id="fDel">删除</button></div>
  <label>名称</label>
  <input type="text" id="fName">
  <label>接口格式</label>
  <select id="fFmt"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select>
  <label>接口地址（OpenAI 兼容一般以 /v1 结尾）</label>
  <input type="text" id="fBase">
  <label>API Key（只存在本机浏览器）</label>
  <input type="password" id="fKey">
  <label>模型</label>
  <div class="row" style="margin-top:0"><select id="fModel"></select><button id="fGet">获取模型</button></div>
  <label>问答提示词（每个服务商独立保存）</label>
  <textarea id="fSys" style="height:80px"></textarea>
  <label>翻译所用服务商</label>
  <select id="tProv"></select>
  <label>翻译所用模型</label>
  <select id="tModel"></select>
  
  
  <label>翻译提示词</label>
  <textarea id="fTr" style="height:64px"></textarea>
  <label>总结所用服务商</label>
  <select id="sProv"></select>
  <label>总结所用模型</label>
  <select id="sModel"></select>
  <label>总结提示词</label>
  <textarea id="fSm" style="height:64px"></textarea>
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="fAuto"> 新回答默认放入队列</label>
  </div>
  <div id="panePref" hidden>
    <label style="display:flex;gap:6px;align-items:center;margin-top:12px"><input type="checkbox" id="pZh"> 打开时默认显示译文</label>
    <label style="margin-top:16px">正文字号：<span id="pFsV"></span></label>
    <div class="row" style="margin-top:0"><input type="range" id="pFs" min="13" max="26" step="0.5" style="flex:1;min-width:0"><button id="pFsR">默认</button></div>
    <div id="fsSample" style="margin-top:6px;font-family:'Noto Serif SC','Songti SC',Georgia,serif;font-size:var(--fs,16.5px);line-height:1.75">The quick brown fox jumps over the lazy dog. 示例文字</div>
    <label style="margin-top:16px">本地备份文件</label>
    <div class="row" style="margin-top:0"><span id="fhName" class="meta" style="flex:1;min-width:0;word-break:break-all"></span><button id="fhChange">更换</button><button id="fhOff" class="del">取消关联</button></div>
    <div class="row"><button id="fhDl">下载完整备份（所有书）</button></div>
  </div>
  <div class="row"><span class="sp"></span><button id="fCancel">取消</button><button class="pri" id="fSave">保存</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
const isRow=l=>/^\s*\|.*\|\s*$/.test(l),isSep=l=>/^\s*\|?[\s:|-]*-{2,}[\s:|-]*\|?\s*$/.test(l);
const md=s=>{const L=String(s).split('\n');let o='',i=0;
  while(i<L.length){
    if(isRow(L[i])&&i+1<L.length&&isSep(L[i+1])){
      const h=cells(L[i]),rows=[];i+=2;
      while(i<L.length&&isRow(L[i]))rows.push(cells(L[i++]));
      o+='<div class="tw"><table><tr>'+h.map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table></div>';
    }else{const m=L[i].match(/^#{1,6}\s+(.*)$/);o+=(m?'<b>'+inl(m[1])+'</b>':inl(L[i]))+'\n';i++}
  }
  return o.replace(/\n$/,'')};
const DEF={autoOn:false,showZh:false,fs:16.5,smSys:'请用中文为这一章写简短摘要：列出主要人物、关键术语及其含义、主要情节或论点，便于阅读后续章节时参考。控制在300字以内。',trSys:'把用户给出的英文翻译成流畅、准确的中文，只输出译文。',sys:'你是阅读助手。用户在阅读一篇文章，会引用其中的片段提问。请结合全文与引用内容，用中文清晰、准确地回答。'};
const PDEF={name:'默认',fmt:'openai',base:'https://api.openai.com/v1',key:'',model:'',models:[],sys:DEF.sys};
const SEL0={prov:0,model:''};
let S={cfg:{...DEF},providers:[],cur:0,tr:{...SEL0},sm:{...SEL0},paras:[],groups:[],useArt:true};
function norm(){
  S.cfg={...DEF,...(S.cfg||{})};S.tr=S.tr||{...SEL0};S.sm=S.sm||{...SEL0};S.providers=S.providers||[];
  if(!S.providers.length){const c=S.cfg;S.providers=[{...PDEF,id:Date.now(),fmt:c.fmt||PDEF.fmt,base:c.base||PDEF.base,key:c.key||'',model:c.model||'',sys:c.sys||DEF.sys}];S.cur=S.providers[0].id}
  S.providers.forEach(p=>{if(p.sys==null)p.sys=S.cfg.sys||DEF.sys;p.models=p.models||[]});
  if(!S.providers.some(p=>p.id===S.cur))S.cur=S.providers[0].id;
}
/* ---------- IndexedDB ---------- */
let db=null,ready=false,dirty=false,ft;
let BK=[],CH=[],curCh=null,sel=new Set(),V={view:'shelf',book:null};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('reading-workbench',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('settings',{keyPath:'k'});d.createObjectStore('books',{keyPath:'id'});d.createObjectStore('chapters',{keyPath:'id'}).createIndex('bookId','bookId')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(st,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction(st,mode);let o;try{o=fn(t)}catch(e){return rej(e)}
  t.oncomplete=()=>{if(mode==='readwrite')schedFile();res(o&&'result' in o?o.result:undefined)};t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbGet=(st,k)=>tx([st],'readonly',t=>t.objectStore(st).get(k));
const dbAll=st=>tx([st],'readonly',t=>t.objectStore(st).getAll());
const dbPut=(st,o)=>tx([st],'readwrite',t=>t.objectStore(st).put(o));
const dbByBook=id=>tx(['chapters'],'readonly',t=>t.objectStore('chapters').index('bookId').getAll(id));
const dbCnt=id=>tx(['chapters'],'readonly',t=>t.objectStore('chapters').index('bookId').count(id));
const settingsRec=()=>({k:'main',cfg:S.cfg,providers:S.providers,cur:S.cur,tr:S.tr,sm:S.sm,useArt:S.useArt});
const syncCur=()=>{if(curCh){curCh.paras=S.paras;curCh.groups=S.groups}};
async function flush(){
  clearTimeout(ft);if(!ready||!dirty||!db)return;dirty=false;syncCur();
  try{await tx(['settings','chapters'],'readwrite',t=>{t.objectStore('settings').put(settingsRec());if(curCh)t.objectStore('chapters').put(curCh)})}
  catch(e){dirty=true;toast('保存失败：'+e.message)}
}
const save=()=>{dirty=true;clearTimeout(ft);ft=setTimeout(flush,300)};
addEventListener('visibilitychange',()=>{if(document.hidden){flush();schedFile(300)}});addEventListener('pagehide',flush);

/* ---------- 本地备份文件（File System Access：桌面 Edge / Chrome） ---------- */
let fh=null,fwT=0,fwAt=0,fwBusy=false,fwAgain=false,fsSt='';
const FSA=!!window.showSaveFilePicker,FPERM={mode:'readwrite'},JT=[{description:'JSON',accept:{'application/json':['.json']}}];
function setFS(st){fsSt=st;const b=$('#bSave');if(!b)return;
  b.classList.toggle('ok',st==='ok');b.classList.toggle('warn',st==='perm'||st==='err');
  b.title=st==='ok'?'已关联备份文件，改动会自动写入':st==='perm'?'需要重新授权：点一下「保存」':st==='err'?'上次写入失败':''}
async function buildAll(){
  const [bs,cs]=await Promise.all([dbAll('books'),dbAll('chapters')]);
  bs.sort((a,b)=>a.created-b.created);
  return {format:'rw-all',v:1,saved:new Date().toISOString(),books:bs.map(b=>({title:b.title,chapters:cs.filter(c=>c.bookId===b.id).sort((x,y)=>x.idx-y.idx).map(c=>({title:c.title,paras:c.paras,groups:c.groups,summary:c.summary||'',mark:c.mark||null}))}))};
}
function schedFile(ms=8000){
  if(!fh)return;const at=Date.now()+ms;
  if(fwT&&fwAt<=at)return;
  clearTimeout(fwT);fwAt=at;fwT=setTimeout(()=>{fwT=0;fwAt=0;fileWrite()},ms);
}
async function fileWrite(manual){
  if(!fh)return;
  if(fwBusy){fwAgain=true;return}
  fwBusy=true;
  try{
    if(await fh.queryPermission(FPERM)!=='granted'){setFS('perm');if(manual)toast('需要授权后才能写入');return}
    await flush();
    const data=await buildAll();
    if(!data.books.some(b=>b.chapters.length)){if(manual)toast('书架是空的，没有写入（避免覆盖备份）');return}
    const w=await fh.createWritable();
    try{await w.write(JSON.stringify(data));await w.close()}catch(e){try{await w.abort()}catch(_){}throw e}
    setFS('ok');if(manual)toast('已写入「'+fh.name+'」');
  }catch(e){const was=fsSt;setFS('err');if(manual||was!=='err')toast('写入备份失败：'+e.message)}
  finally{fwBusy=false;if(fwAgain){fwAgain=false;schedFile(2000)}}
}
async function pickFile(){
  const h=await showSaveFilePicker({suggestedName:'阅读工作台备份.json',types:JT});
  fh=h;await tx(['settings'],'readwrite',t=>t.objectStore('settings').put({k:'fh',h}));
}
async function loadFH(){
  try{const r=await dbGet('settings','fh');if(r&&r.h){fh=r.h;setFS((await fh.queryPermission(FPERM))==='granted'?'ok':'perm')}}catch(e){}
}
async function exportAll(){
  try{
    await flush();const d=await buildAll();
    if(!d.books.some(b=>b.chapters.length))return toast('书架是空的');

async function llm(system,msgs,tr){
  const c=tr==='sm'?smCfg():tr?trCfg():cur();if(!c.key||!c.model)throw Error('请先在 ⚙ 里填写 API Key 和模型名');
  const base=c.base.replace(/\/+$/,'');let url,h={'Content-Type':'application/json'},b;
  if(c.fmt==='anthropic'){url=base+'/v1/messages';h['x-api-key']=c.key;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true';b={model:c.model,max_tokens:4096,messages:msgs};if(system)b.system=system}
  else{url=base+'/chat/completions';h.Authorization='Bearer '+c.key;b={model:c.model,messages:[...(system?[{role:'system',content:system}]:[]),...msgs]}}
  let r;try{r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(b)})}catch(e){throw Error('网络请求失败，可能是接口不允许浏览器直连（CORS）')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error((j.error&&(j.error.message||j.error))||('HTTP '+r.status));
  return c.fmt==='anthropic'?j.content.map(x=>x.text||'').join(''):j.choices[0].message.content;
}

/* ---------- groups ---------- */
const selDiff=q=>{const t=(q.sel||'').trim();return !!t&&t!==(q.en||'').trim()&&t!==(q.zh||'').trim()};
const fmtQuote=q=>{
  if(q.sel===undefined)return `【引用·第${q.i+1}段】`+(q.en?`\nEN: ${q.en}`:'')+(q.zh?`\nZH: ${q.zh}`:'');
  const ss=q.sels||(selDiff(q)?[q.sel]:[]);
  return `【引用·第${q.i+1}段】`+(q.en?`\n原文：${q.en}`:'')+(q.zh?`\n译文：${q.zh}`:'')+ss.map(x=>`\n选中：${x}`).join('');
};
const mergeQ=qs=>{const o=[];qs.forEach(q=>{const m=q.sel!==undefined&&o.find(x=>x.sel!==undefined&&x.i===q.i);if(m){if(selDiff(q))m.sels.push(q.sel)}else o.push({...q,sels:q.sel!==undefined&&selDiff(q)?[q.sel]:[]})});return o};
const fmtGroup=g=>(g.quotes.length?mergeQ(g.quotes).map(fmtQuote).join('\n\n')+'\n\n':'')+'问题：'+g.q;
const sumList=()=>curCh?CH.filter(c=>c.idx<curCh.idx&&c.summary&&c.summary.trim()).sort((a,b)=>a.idx-b.idx):[];
const fullText=()=>S.paras.map(p=>p.en).join('\n\n');
const ordIds=()=>{
  if(!curCh)return [];
  const D=['sys',...sumList().map(c=>c.id),...(curCh.summary&&curCh.summary.trim()?['self']:[]),'full',...S.groups.map(g=>String(g.id)),'cur'],ok=new Set(D);
  const R=(curCh.order||[]).filter((x,k,a)=>ok.has(x)&&a.indexOf(x)===k);
  D.forEach((x,k)=>{if(R.includes(x))return;let p=-1;for(let j=k-1;j>=0&&p<0;j--)p=R.indexOf(D[j]);R.splice(p+1,0,x)});
  return R;
};
const draft=()=>{const q=$('#ask').value.trim();return quotes.length||q?fmtGroup({quotes,q}):''};
function build(fin){
  let sys=curCh?'':cur().sys,pend=[],post=[],msgs=[],after=false,first=true;
  for(const id of ordIds()){
    const add=t=>(after?post:pend).push(t);
    if(id==='sys'){if(first)sys=cur().sys;else add('【提示词】\n'+cur().sys)}
    else if(id==='cur')after=true;
    else if(id==='self'){if(curCh.selfOn)add('【本章摘要】\n'+curCh.summary.trim())}
    else if(id==='full'){if(curCh.fullOn!==false&&S.paras.length)add('【本章全文】\n'+fullText())}
    else{
      const c=CH.find(x=>x.id===id);
      if(c){if(c.sumOn!==false)add(`【前文章节摘要·${c.title}】\n${c.summary.trim()}`)}
      else{const g=S.groups.find(x=>String(x.id)===id);if(g&&g.on&&g.a){msgs.push({role:'user',content:[...pend,fmtGroup(g)].join('\n\n')},{role:'assistant',content:g.a});pend=[]}}
    }
    first=false;
  }
  msgs.push({role:'user',content:[...pend,fin,...post].join('\n\n')});
  return {sys,msgs};
}
const tok=t=>{t=String(t);let c=0;for(const ch of t)if(ch>='\u4e00'&&ch<='\u9fff')c++;return Math.ceil(c*1.3+(t.length-c)/4)};

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
  let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw Error('文件格式不对：不是有效的 EPUB（zip）文件');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={},low={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(!name.endsWith('/')){files[name]={method,csize,off};low[name.toLowerCase()]=name}
  }
  const read=async name=>{
    const f=files[name]||files[low[name.toLowerCase()]];if(!f)throw Error('文件格式不对：EPUB 里找不到 '+name);
    const s0=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u8.subarray(s0,s0+f.csize);
    if(f.method===0)return data;
    if(f.method!==8)throw Error('文件格式不对：不支持的压缩方式');
    return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  };
  return {read,text:async n=>new TextDecoder().decode(await read(n))};
}
const parseDoc=(t,type)=>{let d=new DOMParser().parseFromString(t,type);if(d.getElementsByTagName('parsererror').length&&type!=='text/html')d=new DOMParser().parseFromString(t,'text/html');return d};
const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
function resolvePath(base,href){
  let h=String(href).split('#')[0];try{h=decodeURIComponent(h)}catch(e){}
  const o=[];for(const x of (h.startsWith('/')?h:dirOf(base)+h).split('/')){if(x==='..')o.pop();else if(x&&x!=='.')o.push(x)}
  return o.join('/');

async function importEpub(f){

  const z=await unzip(await f.arrayBuffer());
  const cont=parseDoc(await z.text('META-INF/container.xml'),'application/xml');
  const rf=cont.getElementsByTagName('rootfile')[0];if(!rf)throw Error('文件格式不对：找不到 EPUB 的目录文件');
  const opfPath=rf.getAttribute('full-path'),opf=parseDoc(await z.text(opfPath),'application/xml');
  const man={};[...opf.getElementsByTagName('item')].forEach(it=>man[it.getAttribute('id')]={href:resolvePath(opfPath,it.getAttribute('href')||''),type:it.getAttribute('media-type')||'',prop:it.getAttribute('properties')||''});
  const spine=[...opf.getElementsByTagName('itemref')].map(r=>man[r.getAttribute('idref')]).filter(m=>m&&/html/.test(m.type));
  if(!spine.length)throw Error('文件格式不对：EPUB 里没有可读的章节');
  /* 章节标题：优先目录（nav / NCX） */
  const tt={},setT=(path,t)=>{t=clean(t);if(t&&!tt[path])tt[path]=t};
  const navIt=Object.values(man).find(m=>m.prop.split(/\s+/).includes('nav'));
  if(navIt)try{const d=parseDoc(await z.text(navIt.href),'application/xhtml+xml'),ns=[...d.getElementsByTagName('nav')],n=ns.find(x=>(x.getAttribute('epub:type')||'').includes('toc'))||ns[0];
    if(n)[...n.getElementsByTagName('a')].forEach(a=>setT(resolvePath(navIt.href,a.getAttribute('href')||''),a.textContent))}catch(e){}
  const ncxIt=Object.values(man).find(m=>/ncx/.test(m.type));
  if(ncxIt)try{const d=parseDoc(await z.text(ncxIt.href),'application/xml');
    [...d.getElementsByTagName('navPoint')].forEach(np=>{const l=np.getElementsByTagName('navLabel')[0],c=np.getElementsByTagName('content')[0];
      if(l&&c)setT(resolvePath(ncxIt.href,c.getAttribute('src')||''),(l.getElementsByTagName('text')[0]||l).textContent)})}catch(e){}
  /* 切章节：一个 spine 文件 = 一章 */
  const SEL='p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,dt,dd,figcaption,div,tr',recs=[];let k=0;
  const bid=uid('b');
  for(const m of spine){
    let doc;try{doc=parseDoc(await z.text(m.href),'application/xhtml+xml')}catch(e){continue}
    const body=doc.getElementsByTagName('body')[0]||doc.documentElement;
    body.querySelectorAll('script,style').forEach(x=>x.remove());
    let ps=[...body.querySelectorAll(SEL)].filter(e=>!e.querySelector(SEL)).map(e=>clean(e.textContent)).filter(Boolean);
    if(!ps.length)ps=String(body.textContent||'').split(/\n\s*\n/).map(clean).filter(Boolean);
    const h=body.querySelector('h1,h2,h3'),dt=doc.getElementsByTagName('title')[0];
    const title=(tt[m.href]||clean(h&&h.textContent)||clean(dt&&dt.textContent)||m.href.split('/').pop()).slice(0,80);
    k++;recs.push({id:uid('c')+k,bookId:bid,idx:k,title,paras:ps.map(en=>({en,zh:''})),groups:[],summary:''});
  }
  const dcT=opf.getElementsByTagNameNS('http://purl.org/dc/elements/1.1/','title')[0];
  const title=clean(dcT&&dcT.textContent)||f.name.replace(/\.epub$/i,'')||'EPUB';
  const b={id:bid,title,created:Date.now()};
  await tx(['books','chapters'],'readwrite',t=>{t.objectStore('books').put(b);recs.forEach(r=>t.objectStore('chapters').put(r))});
  BK.push(b);renderShelf();toast(`已导入「${title}」：${recs.length} 章`);openBook(b.id);
}

$('#pFs').oninput=e=>{$('#pFsV').textContent=e.target.value;applyFs(e.target.value)};

$('#fSave').onclick=()=>{readF();S.providers=D;S.cur=dCur;S.tr=DT;S.sm=DS;S.cfg.smSys=$('#fSm').value.trim()||DEF.smSys;S.cfg.trSys=$('#fTr').value.trim()||DEF.trSys;S.cfg.autoOn=$('#fAuto').checked;S.cfg.showZh=$('#pZh').checked;S.cfg.fs=+$('#pFs').value||DEF.fs;save();$('#dlg').close();renderSet();toast('已保存')};

/* 移动章节到其他文件夹 */

$('#mvOk').onclick=async()=>{

/* 智能合并碎段：只在“不像一段结尾”的地方合并 */
$('#bMerge').onclick=()=>{
  const old=S.paras;if(old.length<2)return toast('没有需要合并的段落');
  const END=/[.!?…。！？”"’'»)\]]$/,HY=/[\p{L}][-\u2010\u00ad]$/u,LOW=/^\p{Ll}/u;
  const groups=[],map=[];let cur=null;
  old.forEach((p,i)=>{
    const t=p.en.trim();
    if(cur){
      const a=cur.text;
      let m=null;
      if(HY.test(a)&&/^\p{L}/u.test(t))m=a.slice(0,-1)+t;
      else if(!END.test(a)||LOW.test(t))m=a+(/[—–]$/.test(a)?'':' ')+t;
      if(m!==null){cur.text=m;cur.src.push(i);map[i]=groups.length-1;return}
    }
    cur={text:t,src:[i]};groups.push(cur);map[i]=groups.length-1;
  });
  if(groups.length===old.length)return toast('没有需要合并的段落');
  const paras=groups.map(g=>({en:g.text,zh:g.src.length===1?old[g.src[0]].zh:''}));
  const lost=old.filter(p=>p.zh).length-paras.filter(p=>p.zh).length;
  if(!confirm(`将 ${old.length} 段合并为 ${groups.length} 段`+(lost>0?`，有 ${lost} 段译文会丢失`:'')+'。继续？'))return;
  S.groups.forEach(g=>g.quotes.forEach(q=>{q.i=map[q.i]!==undefined?map[q.i]:Math.min(q.i,paras.length-1)}));
  quotes.forEach(q=>{q.i=map[q.i]!==undefined?map[q.i]:Math.min(q.i,paras.length-1)});
  if(curCh&&curCh.mark){const m=curCh.mark;m.i=map[m.i]!==undefined?map[m.i]:Math.min(m.i,paras.length-1);m.en=paras[m.i].en.slice(0,40)}
  S.paras=paras;save();renderReader();renderAll();toast(`已合并：${old.length} → ${paras.length} 段`);
};
/* 拆分段落：切句 + 按字数 / 按句数攒块 */
const ABBR=new Set('mr mrs ms dr st prof sr jr vs etc e.g i.e inc ltd co no mt fr capt col gen lt sgt rev hon gov sen rep fig vol ch pp approx dept'.split(' '));
const qOpen=t=>{let d=0;for(const c of t){if(c==='“')d++;else if(c==='”')d--}return d>0||(t.match(/"/g)||[]).length%2===1};
function sentSplit(text){
  const qRule=!(qOpen(text)||(text.match(/”/g)||[]).length>(text.match(/“/g)||[]).length);
  const out=[],re=/[.!?…]+["”’'»)\]]*(?=\s)|[。！？]+[”’』」）]*/g;let start=0,m;
  while((m=re.exec(text))){
    const end=m.index+m[0].length,rest=text.slice(end).trimStart();
    if(!rest)break;
    if(/^\p{Ll}/u.test(rest))continue;
    if(/^\.["”’')\]»]*$/.test(m[0])){
      const w=(text.slice(start,m.index).match(/\p{L}[\p{L}.]*$/u)||[''])[0];
      if(ABBR.has(w.toLowerCase())||(/^\p{Lu}$/u.test(w)&&w!=='I')||/^(\p{L}\.)+\p{L}$/u.test(w))continue;
    }
    const seg=text.slice(start,end);
    if(qRule&&qOpen(seg))continue;
    out.push(seg.trim());start=end;
  }
  const tail=text.slice(start).trim();if(tail)out.push(tail);
  return out;
}
const chunkByLen=(sents,target)=>{
  const total=sents.reduce((a,s)=>a+s.length+1,0),n=Math.max(2,Math.round(total/target)),goal=total/n,ch=[];
  let cur=[],len=0;
  for(const s of sents){
    if(cur.length&&len+s.length>goal&&(len+s.length-goal)>(goal-len)){ch.push(cur);cur=[];len=0}
    cur.push(s);len+=s.length+1;
  }
  if(cur.length)ch.push(cur);
  if(ch.length>1&&ch[ch.length-1].join(' ').length<goal*0.4){const l=ch.pop();ch[ch.length-1]=ch[ch.length-1].concat(l)}
  return ch.map(c=>c.join(' '));
};
const chunkByCount=(sents,k)=>{const r=[];for(let i=0;i<sents.length;i+=k)r.push(sents.slice(i,i+k).join(' '));return r};

function applySplit(chunker,label){
  const old=S.paras,paras=[],range=[];let cnt=0;
  old.forEach(p=>{
    const t=p.en.trim(),ch=chunker(t),a=paras.length;
    if(ch&&ch.length>1){cnt++;ch.forEach(c=>paras.push({en:c,zh:''}))}
    else paras.push({en:p.en,zh:p.zh});
    range.push([a,paras.length]);
  });
  if(!cnt)return toast('没有需要拆分的段落');
  const lost=old.filter((p,i)=>p.zh&&range[i][1]-range[i][0]>1).length;
  if(!confirm(`${label}：${cnt} 段被拆开，共 ${old.length} → ${paras.length} 段`+(lost>0?`，有 ${lost} 段译文会丢失`:'')+'。继续？'))return;
  const remap=q=>{
    const r=range[q.i];if(!r){q.i=Math.min(q.i,paras.length-1);return}
    let j=r[0];
    if(r[1]-r[0]>1&&q.en){
      const k=q.en.slice(0,40);let f=-1;
      for(let x=r[0];x<r[1];x++)if(paras[x].en.includes(q.en)){f=x;break}
      if(f<0)for(let x=r[0];x<r[1];x++)if(paras[x].en.includes(k)){f=x;break}
      if(f>=0)j=f;
    }
    q.i=j;
  };
  S.groups.forEach(g=>g.quotes.forEach(remap));quotes.forEach(remap);
  if(curCh&&curCh.mark){remap(curCh.mark);curCh.mark.en=(paras[curCh.mark.i]||{en:''}).en.slice(0,40)}
  S.paras=paras;save();renderReader();renderAll();toast(`已拆分：${old.length} → ${paras.length} 段`);
}
$('#bSplitLen').onclick=()=>applySplit(t=>{
  if(t.length<=800)return null;
  const se=sentSplit(t);return se.length<2?null:chunkByLen(se,400);
},'按字数拆');
$('#bSplitSent').onclick=()=>{
  const v=prompt('每几句合成一段？（1 = 逐句拆开）','3');if(v===null)return;
  const k=parseInt(v,10);if(!(k>=1))return toast('请输入大于等于 1 的整数');
  applySplit(t=>{const se=sentSplit(t);return se.length<=k?null:chunkByCount(se,k)},`按句拆（每 ${k} 句一段）`);
};
/* 编辑全文（重新分段） */
$('#bEdit').onclick=()=>{$('#edText').value=S.paras.map(p=>p.en).join('\n\n');$('#ded').showModal()};
$('#edCancel').onclick=()=>$('#ded').close();
$('#edSave').onclick=()=>{
  const np=$('#edText').value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(!np.length)return toast('内容不能为空');
  const old=S.paras;
  if(np.length===old.length&&np.every((t,i)=>t===old[i].en)){$('#ded').close();return}
  const pool=new Map();old.forEach(p=>{if(p.zh){if(!pool.has(p.en))pool.set(p.en,[]);pool.get(p.en).push(p.zh)}});
  const paras=np.map(en=>{const a=pool.get(en);return {en,zh:(a&&a.shift())||''}});
  const lost=old.filter(p=>p.zh).length-paras.filter(p=>p.zh).length;
  if(lost>0&&!confirm(`有 ${lost} 段译文会因段落改动而丢失（未改动的段落保留译文）。继续？`))return;
  const remap=q=>{
    const o=old[q.i]&&old[q.i].en;let j=o?paras.findIndex(p=>p.en===o):-1;
    if(j<0&&q.en){j=paras.findIndex(p=>p.en.includes(q.en));if(j<0){const k=q.en.slice(0,40);j=paras.findIndex(p=>p.en.includes(k))}}
    q.i=j>=0?j:Math.min(q.i,paras.length-1);
  };
  S.groups.forEach(g=>g.quotes.forEach(remap));quotes.forEach(remap);
  if(curCh&&curCh.mark){remap(curCh.mark);curCh.mark.en=(paras[curCh.mark.i]||{en:''}).en.slice(0,40)}
  S.paras=paras;$('#ded').close();save();renderReader();renderAll();toast('已重新分段：'+paras.length+' 段');
};
/* 弹窗打开时锁定背景滚动 */
const locked=new Map();let lockY=0;
function lockBody(d){
  if(!locked.size){lockY=scrollY;const b=document.body.style;b.position='fixed';b.top=-lockY+'px';b.left='0';b.right='0'}
  locked.set(d,1);
}
function unlockBody(d){
  if(!locked.delete(d)||locked.size)return;
  const b=document.body.style;b.position=b.top=b.left=b.right='';scrollTo(0,lockY);
}
const _sm=HTMLDialogElement.prototype.showModal,_cl=HTMLDialogElement.prototype.close;
HTMLDialogElement.prototype.showModal=function(){lockBody(this);_sm.call(this)};
HTMLDialogElement.prototype.close=function(...a){_cl.apply(this,a);unlockBody(this)};
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>unlockBody(d)));

async function init(){
  let loadErr=false,legacy=null,hadCur=false;
  try{db=await idb()}catch(e){db=null}
  if(!db){toast('需要 IndexedDB，当前浏览器不可用');renderSet();renderReader();renderAll();renderShelf();return}
  try{
    const st=await dbGet('settings','main');let src=st;
    const c0=await dbGet('chapters','current');
    if(c0){hadCur=true;legacy=c0}
    if(!st){try{const d=localStorage.getItem('rw1');if(d){src=JSON.parse(d);if(!legacy&&src.paras&&src.paras.length)legacy={paras:src.paras,groups:src.groups||[]}}}catch(e){}}
    if(src){const {paras,groups,...rest}=src;S={...S,...rest,cfg:{...DEF,...(rest.cfg||{})}}}
    BK=(await dbAll('books')).sort((a,b)=>a.created-b.created);
  }catch(e){loadErr=true;toast('读取数据失败，已暂停保存：'+e.message)}
  norm();
  renderSet();renderReader();renderAll();
  $('#showZh').checked=S.cfg.showZh;applyFs(S.cfg.fs);$('#reader').classList.toggle('showzh',S.cfg.showZh);
  ready=!loadErr;
  if(ready)loadFH();
  if(ready){
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    try{
      if(legacy&&legacy.paras&&legacy.paras.length){
        const b={id:uid('b'),title:'旧文章',created:Date.now()};
        const ch={id:uid('c'),bookId:b.id,idx:1,title:(legacy.paras[0].en||'').slice(0,24)||'文章 1',paras:legacy.paras,groups:legacy.groups||[],summary:''};
        await tx(['books','chapters','settings'],'readwrite',t=>{t.objectStore('books').put(b);t.objectStore('chapters').put(ch);t.objectStore('chapters').delete('current');t.objectStore('settings').put(settingsRec())});
        BK.push(b);toast('旧文章已放进「旧文章」文件夹');
      }else{
        await tx(['chapters','settings'],'readwrite',t=>{if(hadCur)t.objectStore('chapters').delete('current');t.objectStore('settings').put(settingsRec())});
      }
    }catch(e){toast('迁移失败：'+e.message)}
  }
  setView('shelf');renderShelf();
}
init();
